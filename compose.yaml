services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Reach an Ollama running on the host, not inside this container.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CRAWL_HEADLESS: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Without these the Chroma index and crawled pages are lost on restart.
      - askthesite-storage:/app/storage
      - askthesite-workspaces:/app/workspaces
      - askthesite-models:/app/cache
    restart: unless-stopped

volumes:
  askthesite-storage:
  askthesite-workspaces:
  askthesite-models:
